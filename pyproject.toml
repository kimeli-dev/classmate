[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sessionly"
version = "0.5.0"
description = "Sessionly - meetings, classes and trainings: schedule, links, reminders and a learning companion for Windows"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials==6.12.0", "sounddevice==0.5.1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-qt==4.5.0"]

[project.gui-scripts]
sessionly = "sessionly.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
